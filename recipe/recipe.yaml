context:
  name: "ansys-edb-core"
  version: "0.3.3"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ansys_edb_core-${{ version }}.tar.gz
  sha256: ad7eab6b2134b78370a71f2c9a17a9faae562a6e0e8bb6279c8a93523fec04a6

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - flit-core >=3.2,<4
    - pip
    - python ${{ python_min }}.*
  run:
    - ansys-api-edb >=0.2,<0.4
    - ansys-tools-common >=0.3,<1
    - protobuf >=3.19.3,<7
    - grpcio >=1.35.0,<2
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ansys.edb.core
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://pypi.org/project/ansys-edb-core/
  summary: 'Ansys Electronics Database Python Client Package'
  repository: https://github.com/ansys/pyedb-core
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - drewm102
    - SMoraisAnsys
